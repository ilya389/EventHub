<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background:#f4f4f4;
            color: #333;
        }
        header {
            background: #333;
            color: #fff;
            padding: 3px;
            text-align: center;
        }
        header a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 1px;
            background: #333;
            color: #fff;
            margin-top: 20px;
        }
        .event-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>EventHub</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/events/">Мероприятия</a>
            <a href="/about/">О проекте</a>
            <a href="/contacts/">Контакты</a>
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p> 2026 EventHub. Все мероприятия защищены</p>
    </footer>
</body>
</html>
